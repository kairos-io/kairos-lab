name: E2E Linux

on:
  workflow_dispatch:
    inputs:
      iso_url:
        description: Downloadable Kairos ISO URL
        required: true
        type: string

jobs:
  e2e-linux:
    runs-on: ubuntu-26.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 qemu-utils dnsmasq iproute2 acl udev

      - name: Grant access to /dev/kvm
        run: |
          echo "KERNEL==\"kvm\", GROUP=\"$(id -gn)\", MODE=\"0660\", OPTIONS+=\"static_node=kvm\"" | sudo tee /etc/udev/rules.d/99-kvm-access.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo udevadm settle
          sudo setfacl -m "u:$(id -un):rw" /dev/kvm
          test -w /dev/kvm

      - name: Build binary
        run: go build -o ./bin/kairos-lab ./cmd/kairos-lab

      - name: Run e2e tests
        env:
          KAIROS_LAB_E2E: "1"
          ISO_URL: ${{ inputs.iso_url }}
          KAIROS_LAB_BIN: ${{ github.workspace }}/bin/kairos-lab
        run: go test -tags=e2e -v ./test/e2e/...

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: kairos-lab-e2e-logs
          path: |
            /home/runner/.cache/kairos-lab
            /home/runner/.config/kairos-lab
          if-no-files-found: ignore
